# Builds Pass Studio on GitHub and publishes the APK on the repo's Releases page.
#
# Runs on every push to main (except docs, uploaded logos and the hosted art) and on demand:
# Actions tab > Build APK > Run workflow.
#
# Signing: add one repository secret (Settings > Secrets and variables > Actions > New repository secret):
#   KEYSTORE_PASSWORD  the password for signing/release.p12, Pass Studio's own signing key (it's locked with that
#                      password, so the file is safe in the repo; keep the password private)
# With it, every build is signed with the same key, so each new APK installs over the last one and keeps your
# passes and Google key. (The four secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD still
# work instead, for a different key.) Without it the build is debug-signed with a key that changes every run, so
# you'd have to uninstall before installing the next one.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logos/**"   # logos uploaded from the app don't need a new build
      - "art/**"     # the art Google Wallet used to load
      - "art-src/**" # the scripts that draw the theme art (the app has the pictures)
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish a release with the APK attached

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          # A space, line break or quotes picked up when pasting the password shouldn't stop it from working.
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed -E "s/^[[:space:]\"'\`]+//; s/[[:space:]\"'\`]+\$//")
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > keystore/release.p12
            {
              printf 'storeFile=release.p12\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > keystore/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEYSTORE_PASSWORD" ] && [ -f signing/release.p12 ]; then
            # Pass Studio's own key, kept in the repo and opened with the KEYSTORE_PASSWORD secret.
            cp signing/release.p12 keystore/release.p12
            if keytool -list -storetype PKCS12 -keystore keystore/release.p12 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              {
                printf 'storeFile=release.p12\n'
                printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
                printf 'keyAlias=passstudio\n'
                printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
              } > keystore/keystore.properties
              echo "signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::KEYSTORE_PASSWORD doesn't open signing/release.p12 (it has to match exactly; paste it rather than typing it). Building a debug-signed APK."
            fi
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secret found. Building a debug-signed APK that won't install over the previous one."
          fi

      - name: Build the APK
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
            APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          else
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Point out what broke the build
        # Puts the compiler's error lines on the run's summary page, so they're readable without the full log.
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          MSG=$(grep -E '^e: |^ERROR|error:|What went wrong' -A2 build.log | head -80 | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$MSG" ] && echo "::error title=Build failed::$MSG" || true

      - name: Name the APK
        id: meta
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SUFFIX=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || SUFFIX="-debug"
          NAME="PassStudio-${VERSION}${SUFFIX}.apk"
          cp "$APK_PATH" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep a copy with the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}
          if-no-files-found: error

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          EXTRA=""
          NOTE="Signed with your release key, so it installs over the last version."
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            EXTRA="--prerelease"
            NOTE="Debug-signed (the signing secrets aren't set), so uninstall the old version before installing this one."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (re-run); keeping it."
            exit 0
          fi
          gh release create "$TAG" "${{ steps.meta.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Pass Studio ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Built from commit ${GITHUB_SHA::7}. $NOTE" \
            $EXTRA
